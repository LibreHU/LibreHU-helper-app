name: Report test (Android 9)

# The report of a published APK on an Android 9 emulator (1280x720, 160 dpi like the head units), to the app's folder
# then to a folder picked in DocumentsUI: logcat (stack traces), screenshots and the report's file list in the
# "report-test" artifact, for a crash nobody can take a logcat of on the unit (tools/report_test.py).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose APK is tested
        default: latest-main

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APK
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o helper.apk \
            "https://github.com/LibreHU/LibreHU-helper-app/releases/download/${{ inputs.tag }}/LibreHU-Helper-main.apk"
          sha256sum helper.apk

      - name: Report on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x720
          script: python3 tools/report_test.py helper.apk out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-test
          path: out
